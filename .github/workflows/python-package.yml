# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

# Define cuándo se ejecutará el workflow.
on:

  # Ejecuta el workflow cuando se produzca una actividad
  # relacionada con una Pull Request.
  pull_request:

    # Limita la ejecución a las Pull Requests
    # cuyo destino sea la rama main.
    branches: ["main"]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    # Utiliza una Action ya preparada por GitHub.
    #
    # actions/checkout descarga el contenido del repositorio
    # dentro del runner para poder trabajar con el código.
    #
    # @v4 indica la versión principal de la Action utilizada.
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    # Nombre descriptivo del step.
    # Aparecerá con este nombre en los logs de GitHub Actions.
    - name: Test with pytest
    
      # Ejecuta pytest dentro del runner.
      #
      # El símbolo "|" permite escribir uno o varios comandos
      # en las líneas siguientes.
      #
      # --verbose muestra el resultado detallado de cada test.
      run: |
        pytest --verbose
    
